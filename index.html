<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сёма · тамагочи 🐾</title>
<style>
  :root {
    --bg1: #2c3e50; --bg2: #6b7f95;
    --card: #ffffff; --accent: #ffb454; --text: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text);
  }
  .card {
    width: 100%; max-width: 480px;
    background: var(--card); border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  header { padding: 18px 22px 10px; text-align: center; position: relative; }
  header h1 {
    font-size: 24px; letter-spacing: 3px;
    color: #33404f; font-family: 'Courier New', monospace; font-weight: 800;
  }
  header p {
    margin-top: 4px; font-size: 11px; color: #999;
    letter-spacing: 1.5px; text-transform: uppercase;
  }
  #settingsBtn {
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px;
    border: none; background: transparent; cursor: pointer;
    font-size: 16px; opacity: 0.4; transition: opacity 0.2s;
    border-radius: 8px;
  }
  #settingsBtn:hover { opacity: 1; background: #f4f6f9; }

  /* Сцена с котом */
  .scene {
    margin: 6px 20px 14px;
    background: #f4f6f9; border-radius: 16px; padding: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 240px; overflow: hidden; position: relative;
  }
  .scene svg {
    width: 100%; max-width: 200px; height: auto;
    image-rendering: pixelated;
    transition: transform 0.3s ease;
  }
  .scene.pop svg { animation: pop 0.35s ease; }
  @keyframes pop {
    0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); }
  }
  .speech {
    position: absolute; top: 12px; left: 12px; right: 12px;
    text-align: center;
    font-size: 12px;
    color: #6a7686;
    font-style: italic;
    min-height: 16px;
    transition: opacity 0.25s ease;
  }
  .speech.fade { opacity: 0; }

  /* Полоски */
  .stats {
    padding: 0 22px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .stat {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .stat .icon { width: 22px; text-align: center; font-size: 15px; }
  .stat .bar {
    flex: 1; height: 10px; background: #eef1f5;
    border-radius: 999px; overflow: hidden;
  }
  .stat .bar-fill {
    height: 100%; width: 0%;
    transition: width 0.4s ease, background 0.3s ease;
    border-radius: 999px;
  }
  .stat .num {
    width: 28px; text-align: right;
    font-size: 11px; color: #999;
    font-variant-numeric: tabular-nums;
  }
  .stat .label {
    width: 78px; color: #6a7686;
    font-size: 12px;
  }

  /* Кнопки */
  .actions {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; padding: 4px 20px 18px;
  }
  .actions button {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; font-size: 14px; font-weight: 600;
    color: #33404f; background: #f4f6f9;
    border: 2px solid transparent; border-radius: 12px;
    cursor: pointer; transition: all 0.2s ease;
    font-family: inherit;
  }
  .actions button:hover:not(:disabled) {
    background: #e8ecf2; transform: translateY(-1px);
  }
  .actions button:active:not(:disabled) { transform: scale(0.98); }
  .actions button:disabled { opacity: 0.35; cursor: not-allowed; }
  .actions button .emoji { font-size: 16px; }

  .footer {
    text-align: center; padding: 0 20px 18px;
    font-size: 11px; color: #bbb; letter-spacing: 0.5px;
  }
  #statusIndicator { display: inline-flex; align-items: center; gap: 4px; }
  #statusIndicator .dot { font-size: 14px; line-height: 1; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #33404f; color: #fff;
    padding: 10px 18px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
</style>
</head>
<body>
  <main class="card">
    <header>
      <h1>СЁМА</h1>
      <p id="ageLabel">pixel cat · 0 дней вместе</p>
      <button id="settingsBtn" title="Настройки">⚙️</button>
    </header>

    <div class="scene" id="scene">
      <div class="speech" id="speech"></div>
      <div id="catHolder"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="icon">🍽️</span>
        <span class="label">Сытость</span>
        <div class="bar"><div class="bar-fill" id="barHunger"></div></div>
        <span class="num" id="numHunger">0</span>
      </div>
      <div class="stat">
        <span class="icon">⚡</span>
        <span class="label">Энергия</span>
        <div class="bar"><div class="bar-fill" id="barEnergy"></div></div>
        <span class="num" id="numEnergy">0</span>
      </div>
      <div class="stat">
        <span class="icon">💛</span>
        <span class="label">Настроение</span>
        <div class="bar"><div class="bar-fill" id="barMood"></div></div>
        <span class="num" id="numMood">0</span>
      </div>
    </div>

    <div class="actions">
      <button data-action="feed"><span class="emoji">🍽️</span>Покормить</button>
      <button data-action="play"><span class="emoji">🧶</span>Поиграть</button>
      <button data-action="sleep"><span class="emoji">😴</span>Уложить спать</button>
      <button data-action="pet"><span class="emoji">🤚</span>Погладить</button>
    </div>

    <div class="footer">
      <span id="statusIndicator"><span class="dot">●</span><span id="statusText">запуск…</span></span>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<script>
  /* ============================================================
     1. НАСТРОЙКИ РЕПОЗИТОРИЯ
  */
  const GITHUB = {
    owner: 'sddfsdfr999-prog',
    repo:  'Sema',
    branch: 'main',
    path:  'state.txt'
  };
  const API_URL = `https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${GITHUB.path}`;
  const RAW_URL = `https://raw.githubusercontent.com/${GITHUB.owner}/${GITHUB.repo}/${GITHUB.branch}/${GITHUB.path}`;
  const TOKEN_KEY = 'gh_token';

  /* ============================================================
     2. ПИКСЕЛЬНЫЕ КОТЫ
     Символы: . прозр  g шерсть  d тёмный  l светлый  k глаза
              w блик  p нос  o оранж  r красн  b коричн  z звук
  */
  const COLORS = {
    'g': '#8b98a8', 'd': '#5a6b82', 'l': '#c8d1dc',
    'k': '#1a2332', 'w': '#ffffff', 'p': '#e29aa2',
    'o': '#ff8e53', 'y': '#d96e35', 'r': '#c0392b',
    'b': '#8b4513', 'z': '#7f8fa6'
  };

  const CATS = {
    // Обычное состояние — стоит
    idle: [
      '................','....dd....dd....','...dggd..dggd...',
      '...dggggggggd...','..dggggggggggd..','..dgkgggggkggd..',
      '..dgkwgggkwggd..','..dggggggggggd..','..dggggpgggggd..',
      '..dggggggggggd..','...dggggggggd...','....dggggggd....',
      '....ll....ll....','...ll......ll...','................','................'
    ],
    // Спит — глаза закрыты, Zzz
    sleeping: [
      '................','................','................',
      '.....dd...dd....','....dggd.dggd...','....dgggggggd...',
      '...dgggggggggd..','...dgggggggggd..','...dgkgggggkgd..',
      '...dggggpggggd..','...dgggggggggd..','...dgggggggggd..',
      '....dgggggggd...','.....dllllld....','......ddddd.....','.....z..Z.......'
    ],
    // Грустный — уголки рта вниз
    sad: [
      '................','....dd....dd....','...dggd..dggd...',
      '...dggggggggd...','..dggggggggggd..','..dgkgggggkggd..',
      '..dgkwgggkwggd..','..dggggggggggd..','..dggggpgggggd..',
      '..dggggggggggd..','...dggggggggd...','....dggggggd....',
      '....ll....ll....','...ll......ll...','................','................'
    ],
    // Кушает — миска
    eating: [
      '................','....dd....dd....','...dggd..dggd...',
      '...dggggggggd...','..dggggggggggd..','..dgkgggggkggd..',
      '..dgkwgggkwggd..','..dggggggggggd..','..dgggkkkkgggd..',
      '..dggggggggggd..','...dggggggggd...','....dggggggd....',
      '...ll.rrrr.ll...','..ll..bbbb..ll..','......dddd......','................'
    ],
    // Играет — клубок
    playing: [
      '................','....dd....dd....','...dggd..dggd...',
      '...dggggggggd...','..dggggggggggd..','..dgkgggggkggd..',
      '..dgkwgggkwggd..','..dggggggggggd..','..dggggpgggggd..',
      '..dggggggggggd..','..lldggggggdll..','...lldggggdll...',
      '....dggggggd....','...oo.dggggd.oo.','..o.y..dddd..y.o','................'
    ],
    // Сыт и счастлив — улыбка
    happy: [
      '................','....dd....dd....','...dggd..dggd...',
      '...dggggggggd...','..dggggggggggd..','..dgkgggggkggd..',
      '..dgkwgggkwggd..','..dggggggggggd..','..dggggpgggggd..',
      '..dggggggggggd..','...dggggggggd...','....dggggggd....',
      '....ll....ll....','...ll......ll...','................','................'
    ]
  };

  const PX = 14;
  function renderArt(art) {
    const rows = art.length, cols = art[0].length;
    const w = cols * PX, h = rows * PX;
    let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">`;
    for (let y = 0; y < rows; y++)
      for (let x = 0; x < cols; x++) {
        const c = COLORS[art[y][x]];
        if (c) svg += `<rect x="${x*PX}" y="${y*PX}" width="${PX}" height="${PX}" fill="${c}"/>`;
      }
    return svg + '</svg>';
  }

  /* ============================================================
     3. СОСТОЯНИЕ
  */
  let state = {
    hunger: 80,       // 0-100
    energy: 80,       // 0-100
    mood:   80,       // 0-100
    lastTick: Date.now(),
    bornAt: Date.now(),
    counts: { feed: 0, play: 0, sleep: 0, pet: 0 },
    updatedAt: 0
  };

  // Падение в час
  const DECAY = {
    hunger: 10,   // сытость падает на 10/час
    energy: 6,    // энергия на 6/час
    mood:   8     // настроение на 8/час
  };

  function clamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }

  function applyDecay() {
    const now = Date.now();
    const elapsed = now - (state.lastTick || now);
    const hours = elapsed / 3600000;

    state.hunger = clamp(state.hunger - DECAY.hunger * hours);
    state.energy = clamp(state.energy - DECAY.energy * hours);
    state.mood   = clamp(state.mood   - DECAY.mood   * hours);

    // Если сыт и энергичен — настроение потихоньку растёт
    if (state.hunger > 60 && state.energy > 60) {
      state.mood = clamp(state.mood + 1);
    }

    state.lastTick = now;
  }

  /* ============================================================
     4. UI
  */
  const holder    = document.getElementById('catHolder');
  const scene     = document.getElementById('scene');
  const speechEl  = document.getElementById('speech');
  const statusText = document.getElementById('statusText');
  const statusDot  = document.querySelector('#statusIndicator .dot');
  const ageLabel   = document.getElementById('ageLabel');
  const toast      = document.getElementById('toast');

  let currentArt = 'idle';
  let busyAction = null;   // какая анимация сейчас играет

  function setStatus(text, color) {
    statusText.textContent = text;
    statusDot.style.color = color;
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function setSpeech(text) {
    speechEl.classList.add('fade');
    setTimeout(() => {
      speechEl.textContent = text;
      speechEl.classList.remove('fade');
    }, 150);
  }

  function pickArt() {
    // Если действие активно — показываем его
    if (busyAction) return busyAction;

    // Иначе — по состоянию
    if (state.energy < 20) return 'sleeping';
    if (state.hunger < 25) return 'sad';
    if (state.mood < 25)   return 'sad';
    if (state.hunger > 80 && state.energy > 80 && state.mood > 80) return 'happy';
    return 'idle';
  }

  function pickSpeech() {
    if (busyAction) return '';
    if (state.energy < 20) return 'Сёма хочет спать…';
    if (state.hunger < 25) return 'Сёма голодный! 😿';
    if (state.mood < 25)   return 'Сёме грустно, поиграй с ним';
    if (state.hunger > 80 && state.energy > 80 && state.mood > 80) return 'Сёма счастлив! 🐾';
    return '';
  }

  function barColor(v) {
    if (v < 25) return 'linear-gradient(90deg, #e74c3c, #ff8e53)';
    if (v < 55) return 'linear-gradient(90deg, #ffb454, #ffd97a)';
    return 'linear-gradient(90deg, #2ecc71, #7ad99a)';
  }

  function updateBars() {
    document.getElementById('barHunger').style.width = state.hunger + '%';
    document.getElementById('barHunger').style.background = barColor(state.hunger);
    document.getElementById('numHunger').textContent = state.hunger;

    document.getElementById('barEnergy').style.width = state.energy + '%';
    document.getElementById('barEnergy').style.background = barColor(state.energy);
    document.getElementById('numEnergy').textContent = state.energy;

    document.getElementById('barMood').style.width = state.mood + '%';
    document.getElementById('barMood').style.background = barColor(state.mood);
    document.getElementById('numMood').textContent = state.mood;
  }

  function updateAge() {
    const days = Math.max(0, Math.floor((Date.now() - (state.bornAt || Date.now())) / 86400000));
    ageLabel.textContent = `pixel cat · ${days} ${daysWord(days)} вместе`;
  }
  function daysWord(n) {
    const m = n % 10, h = n % 100;
    if (h >= 11 && h <= 19) return 'дней';
    if (m === 1) return 'день';
    if (m >= 2 && m <= 4) return 'дня';
    return 'дней';
  }

  function render({ animate = true } = {}) {
    const artKey = pickArt();
    currentArt = artKey;
    holder.innerHTML = renderArt(CATS[artKey]);
    if (animate) {
      scene.classList.add('pop');
      setTimeout(() => scene.classList.remove('pop'), 350);
    }
    updateBars();
    updateAge();
    const s = pickSpeech();
    if (s) setSpeech(s);
  }

  /* ============================================================
     5. ТОКЕН
  */
  function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

  function askToken() {
    const t = prompt(
      'Введите GitHub fine-grained token (сохранится только в этом браузере).\n\n' +
      'Создать: github.com/settings/personal-access-tokens/new\n' +
      'Права: Contents → Read and write\n' +
      'Repository access: только репозиторий ' + GITHUB.repo
    );
    if (t && t.trim()) {
      localStorage.setItem(TOKEN_KEY, t.trim());
      setStatus('токен сохранён', '#2ecc71');
      pullFromGithub({ force: true });
    } else {
      setStatus('токен не задан — только чтение', '#e67e22');
    }
  }
  document.getElementById('settingsBtn').addEventListener('click', () => {
    const cur = getToken();
    if (cur) {
      if (!confirm('Токен уже задан. Удалить его из этого браузера?')) return;
      localStorage.removeItem(TOKEN_KEY);
    }
    askToken();
  });

  /* ============================================================
     6. ЧТЕНИЕ
  */
  let lastPushTime = 0;

  function applyRemote(remote, mode) {
    if (remote && typeof remote.hunger === 'number') {
      // Чужое состояние новее — берём его
      if ((remote.updatedAt || 0) > (state.updatedAt || 0)) {
        state = Object.assign(state, remote);
        applyDecay();
        render({ animate: true });
      }
    }
    setStatus(mode === 'api' ? 'синхронизировано' : 'raw-режим · кеш ~5 мин',
              mode === 'api' ? '#2ecc71' : '#e67e22');
  }

  async function pullFromGithub({ force = false } = {}) {
    if (!force && Date.now() - lastPushTime < 7000) return;
    const token = getToken();

    if (token) {
      try {
        const res = await fetch(`${API_URL}?ref=${GITHUB.branch}&t=${Date.now()}`, {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/vnd.github+json'
          }
        });
        if (res.ok) {
          const meta = await res.json();
          const bin = atob((meta.content || '').replace(/\n/g, ''));
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const remote = JSON.parse(new TextDecoder('utf-8').decode(bytes));
          applyRemote(remote, 'api');
          return;
        }
      } catch (e) { console.warn('[pull] api error', e); }
    }

    try {
      const res = await fetch(`${RAW_URL}?t=${Date.now()}`);
      if (!res.ok) { setStatus('pull ' + res.status, '#e74c3c'); return; }
      const remote = await res.json();
      applyRemote(remote, 'raw');
    } catch (e) {
      setStatus('pull: ' + (e.message || e.name), '#e74c3c');
    }
  }

  /* ============================================================
     7. ЗАПИСЬ
  */
  function b64encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  let writing = false, pending = false, pushAttempt = 0;

  async function pushToGithub() {
    const token = getToken();
    if (!token) return;
    if (writing) { pending = true; return; }
    writing = true;
    try {
      const headers = {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      };
      const getRes = await fetch(`${API_URL}?ref=${GITHUB.branch}&t=${Date.now()}`, { headers });
      if (!getRes.ok) throw new Error('GET ' + getRes.status);
      const meta = await getRes.json();

      state.updatedAt = Date.now();
      const body = {
        message: `sema: ${currentArt} [skip ci]`,
        content: b64encode(JSON.stringify(state, null, 2)),
        branch: GITHUB.branch,
        sha: meta.sha
      };
      const putRes = await fetch(API_URL, {
        method: 'PUT',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (putRes.ok) {
        pushAttempt = 0; lastPushTime = Date.now();
        setStatus('синхронизировано', '#2ecc71');
      } else if (putRes.status === 409) {
        pushAttempt++; writing = false;
        if (pushAttempt <= 3) {
          setStatus(`конфликт, повтор ${pushAttempt}/3…`, '#e67e22');
          setTimeout(pushToGithub, 1200);
        } else {
          setStatus('конфликт: перезагрузите страницу', '#e74c3c');
          pushAttempt = 0;
        }
        return;
      } else {
        pushAttempt = 0;
        setStatus('ошибка записи: ' + putRes.status, '#e74c3c');
      }
    } catch (e) {
      console.error(e);
      setStatus('ошибка записи (сеть)', '#e74c3c');
    } finally {
      writing = false;
      if (pending) { pending = false; pushToGithub(); }
    }
  }

  /* ============================================================
     8. ДЕЙСТВИЯ
  */
  function runAction(action) {
    applyDecay();

    let art, msg;
    switch (action) {
      case 'feed':
        if (state.hunger >= 95) { showToast('Сёма не голоден'); return; }
        state.hunger = clamp(state.hunger + 30);
        state.mood   = clamp(state.mood + 5);
        state.counts.feed = (state.counts.feed || 0) + 1;
        art = 'eating'; msg = 'Сёма кушает 🍽️';
        break;
      case 'play':
        if (state.energy < 15) { showToast('Сёма слишком устал'); return; }
        state.mood   = clamp(state.mood + 25);
        state.energy = clamp(state.energy - 15);
        state.hunger = clamp(state.hunger - 8);
        state.counts.play = (state.counts.play || 0) + 1;
        art = 'playing'; msg = 'Сёма играет 🧶';
        break;
      case 'sleep':
        if (state.eneраузере).\n\n' +
      'Создать: github.com/settings/personal-access-tokens/new\n' +
      'Права: Contents → Read and write\n' +
      'Repository access: только репозиторий ' + GITHUB.repo
    );
    if (t && t.trim()) {
      localStorage.setItem(TOKEN_KEY, t.trim());
      setStatus('токен сохранён', '#2ecc71');
      pullFromGithub({ force: true });
    } else {
      setStatus('токен не задан — только чтение', '#e67e22');
    }
  }
  document.getElementById('settingsBtn').addEventListener('click', () => {
    const cur = getToken();
    if (cur) {
      if (!confirm('Токен уже задан. Удалить его из этого браузера?')) return;
      localStorage.removeItem(TOKEN_KEY);
    }
    askToken();
  });

  /* ============================================================
     5. ЧТЕНИЕ из GitHub
     Сначала API (без кеша). Если не получилось — fallback на raw.
     Убраны Cache-Control и cache: 'no-store' — они ломали старые браузеры.
  */
  let lastPushTime = 0;

  function applyRemote(remote, mode) {
    if (remote && remote.state && remote.counts) {
      const changed = remote.updatedAt !== data.updatedAt;
      data = remote;
      render({ animate: changed });
      updateCountsUI();
    }
    if (mode === 'api') {
      setStatus('синхронизировано', '#2ecc71');
    } else if (mode === 'raw') {
      setStatus('raw-режим · кеш ~5 мин', '#e67e22');
    }
  }

  async function pullFromGithub({ force = false } = {}) {
    if (!force && Date.now() - lastPushTime < 7000) return;

    const token = getToken();

    // 1. Пытаемся через API — только если есть токен
    if (token) {
      try {
        const url = `${API_URL}?ref=${GITHUB.branch}&t=${Date.now()}`;
        console.log('[pull] API', url);

        const res = await fetch(url, {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/vnd.github+json'
          }
        });

        console.log('[pull] API status:', res.status);

        if (res.ok) {
          const meta = await res.json();
          const bin = atob((meta.content || '').replace(/\n/g, ''));
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const remote = JSON.parse(new TextDecoder('utf-8').decode(bytes));
          console.log('[pull] API parsed:', remote);
          applyRemote(remote, 'api');
          return;
        }
        console.warn('[pull] API failed, fallback to raw');
      } catch (e) {
        console.warn('[pull] API error:', e.message || e.name);
      }
    }

    // 2. Fallback — raw без токена (работает везде, но с кешем ~5 мин)
    try {
      const url = `${RAW_URL}?t=${Date.now()}`;
      console.log('[pull] raw', url);

      const res = await fetch(url);
      console.log('[pull] raw status:', res.status);

      if (!res.ok) {
        setStatus('pull ' + res.status, '#e74c3c');
        return;
      }

      const remote = await res.json();
      applyRemote(remote, 'raw');
    } catch (e) {
      console.error('[pull] raw error:', e);
      setStatus('pull: ' + (e.message || e.name), '#e74c3c');
    }
  }

  /* ============================================================
     6. ЗАПИСЬ в GitHub
     При 409 (конфликт sha) — до 3 повторов с паузой 1.2 сек.
  */
  function b64encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  let writing = false;
  let pending = false;
  let pushAttempt = 0;

  async function pushToGithub() {
    const token = getToken();
    if (!token) return;
    if (writing) { pending = true; return; }
    writing = true;

    try {
      const headers = {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      };

      const getRes = await fetch(`${API_URL}?ref=${GITHUB.branch}&t=${Date.now()}`, {
        headers
      });
      if (!getRes.ok) throw new Error('GET ' + getRes.status);
      const meta = await getRes.json();

      const body = {
        message: `sema: ${data.state} [skip ci]`,
        content: b64encode(JSON.stringify(data, null, 2)),
        branch: GITHUB.branch,
        sha: meta.sha
      };

      const putRes = await fetch(API_URL, {
        method: 'PUT',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (putRes.ok) {
        pushAttempt = 0;
        lastPushTime = Date.now();
        setStatus('синхронизировано', '#2ecc71');
      } else if (putRes.status === 409) {
        pushAttempt++;
        writing = false;
        if (pushAttempt <= 3) {
          setStatus(`конфликт, повтор ${pushAttempt}/3…`, '#e67e22');
          setTimeout(pushToGithub, 1200);
        } else {
          setStatus('конфликт: перезагрузите страницу', '#e74c3c');
          pushAttempt = 0;
        }
        return;
      } else {
        pushAttempt = 0;
        const t = await putRes.text();
        console.error('PUT failed', putRes.status, t);
        setStatus('ошибка записи: ' + putRes.status, '#e74c3c');
      }
    } catch (e) {
      console.error(e);
      setStatus('ошибка записи (сеть)', '#e74c3c');
    } finally {
      writing = false;
      if (pending) { pending = false; pushToGithub(); }
    }
  }

  /* ============================================================
     7. ОБРАБОТКА КЛИКОВ
  */
  buttons.forEach(b => {
    b.addEventListener('click', () => {
      data.state = b.dataset.state;
      data.counts[data.state] = (data.counts[data.state] || 0) + 1;
      data.updatedAt = Date.now();
      render();
      updateCountsUI();

      if (!getToken()) {
        setStatus('нажмите ⚙️ чтобы ввести токен', '#e67e22');
        return;
      }
      pushToGithub();
    });
  });

  /* ============================================================
     8. СТАРТ + периодический опрос
  */
  (async function init() {
    await pullFromGithub({ force: true });
    if (!getToken()) {
      setStatus('нажмите ⚙️ чтобы ввести токен', '#e67e22');
    }
    setInterval(() => pullFromGithub(), 8000);
  })();
</script>
</body>
</html>
